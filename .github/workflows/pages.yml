name: Publish Robot Middleware Atlas

on:
  push:
    branches: [main]
  workflow_dispatch:

# This workflow publishes ONLY this repository's compiled Sphinx output.
# It never checks out, modifies, or triggers the personal Vite website repo.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: robot-middleware-atlas-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout article sources
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Sphinx dependencies
        run: python -m pip install -r requirements.txt

      - name: Build and validate the entire documentation site
        run: make PYTHON=python html-full

      - name: Preserve Sphinx underscore-prefixed assets
        run: touch site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy independent project site
        id: deployment
        uses: actions/deploy-pages@v4
